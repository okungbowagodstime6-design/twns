name: Run due news ingestion

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: due-news-ingestion
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Call the protected ingestion endpoint
        env:
          CRON_URL: ${{ vars.CRON_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [[ -z "$CRON_URL" ]]; then
            echo "::error::Configure the repository variable CRON_URL."
            exit 1
          fi
          if [[ -z "$CRON_SECRET" ]]; then
            echo "::error::Configure the repository secret CRON_SECRET."
            exit 1
          fi
          case "$CRON_URL" in
            https://*/api/admin/ingestion/run-due) ;;
            *)
              echo "::error::CRON_URL must use HTTPS and end with /api/admin/ingestion/run-due."
              exit 1
              ;;
          esac
          curl --fail-with-body --silent --show-error --max-time 600 \
            --request POST \
            --header "Authorization: Bearer ${CRON_SECRET}" \
            "$CRON_URL"
